      <text x="24" y="104">};</text>
      <text x="24" y="119"><tspan fill="#c084fc">function</tspan> publicar(post: Post) {</text>
      <text x="24" y="134">  <tspan fill="#c084fc">return</tspan> blog.salvar(post);</text>
      <text x="24" y="149">}</text>
