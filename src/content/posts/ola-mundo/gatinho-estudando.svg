    <text x="76" y="32" fill="#d9c6ec" font-family="monospace" font-size="11">organizar.py</text>
    <g fill="#ddd4e8" font-family="'Courier New', monospace" font-size="11.5">
      <text x="24" y="59"><tspan fill="#c084fc">def</tspan> organizar(ideias):</text>
      <text x="24" y="74">    plano = []</text>
      <text x="24" y="89">    <tspan fill="#c084fc">for</tspan> ideia <tspan fill="#c084fc">in</tspan> ideias:</text>
      <text x="24" y="104">        plano.append(ideia)</text>
      <text x="24" y="119">    <tspan fill="#c084fc">return</tspan> plano</text>
      <text x="24" y="134">proximo = obter_tarefa()</text>
      <text x="24" y="149">executar(proximo)</text>
      <text x="24" y="164"><tspan fill="#86c9ed">print</tspan>(<tspan fill="#f3d68a">"pronto"</tspan>)</text>
    </g>
  </g>

