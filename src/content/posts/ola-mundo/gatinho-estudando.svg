    <text x="76" y="32" fill="#d9c6ec" font-family="monospace" font-size="11">ideias.ts</text>
    <g fill="#ddd4e8" font-family="'Courier New', monospace" font-size="11.5">
      <text x="24" y="59"><tspan fill="#c084fc">const</tspan> ideias = <tspan fill="#8cd7c2">await</tspan> ler();</text>
      <text x="24" y="74"><tspan fill="#c084fc">const</tspan> post = escolher(ideias);</text>
      <text x="24" y="89"><tspan fill="#c084fc">if</tspan> (post.publicavel) {</text>
      <text x="24" y="104">  salvar(post);</text>
      <text x="24" y="119">  atualizar(<tspan fill="#f3d68a">"blog"</tspan>);</text>
      <text x="24" y="134">} <tspan fill="#c084fc">else</tspan> { revisar(post); }</text>
      <text x="24" y="149">publicar(post.titulo);</text>
      <text x="24" y="164"><tspan fill="#8cd7c2">await</tspan> concluir();</text>
    </g>
  </g>

  <g transform="translate(450 144)" filter="url(#sombra)">
