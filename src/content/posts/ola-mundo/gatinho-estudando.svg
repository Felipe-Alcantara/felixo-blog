    <g fill="#ddd4e8" font-family="'Courier New', monospace" font-size="11.5">
      <text x="24" y="59"><tspan fill="#c084fc">.blog</tspan> {</text>
      <text x="24" y="74">  display: <tspan fill="#86c9ed">grid</tspan>;</text>
      <text x="24" y="89">  grid-template-columns:</text>
      <text x="24" y="104">    repeat(2, 1fr);</text>
      <text x="24" y="119">  gap: 1rem;</text>
      <text x="24" y="134">  color: <tspan fill="#f3d68a">#d9c3ff</tspan>;</text>
      <text x="24" y="149">}</text>
      <text x="24" y="164"><tspan fill="#c084fc">.titulo</tspan> { color: <tspan fill="#f3d68a">#c084fc</tspan>; }</text>
    </g>
  </g>

